[package]
name = "potato"
version = "0.21.0"
edition = "2021"

[lib]
name = "potato_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "potato"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
walkdir = "2"
rfd = "0.15"
tokio = { version = "1", features = ["rt", "process"] }
dirs = "6"

# PDF export drives the webview's own print engine, so the output matches the
# in-app rendering exactly and needs no external tool (chromium, wkhtmltopdf).
# Versions are pinned to whatever tauri/wry already resolve to.
[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = "2.0.1"
gtk = "0.18"
glib = "0.18"
